stages:
  - deploy

variables:
  TF_ROOT: "."
  IMAGE_NAME: "test-app"

.before_aws: &before_aws
  before_script:
    - apk add --no-cache python3 py3-pip curl bash
    - pip3 install awscli
    - aws configure set aws_access_key_id $AWS_ACCESS_KEY_ID
    - aws configure set aws_secret_access_key $AWS_SECRET_ACCESS_KEY
    - aws configure set region $AWS_REGION

.deploy_template: &deploy_template
  stage: deploy
  image: hashicorp/terraform:1.6.6
  <<: *before_aws
  script:
    - cd $TF_ROOT

    - export ECR_REGISTRY="$AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com"
    - export IMAGE_URI="$ECR_REGISTRY/$IMAGE_NAME:$IMAGE_TAG"

    - echo "Deploying image - $IMAGE_URI"

    - terraform init -input=false \
        -backend-config="bucket=wowcher-terraform-state-bucket" \
        -backend-config="key=ecs/${ENV}/terraform.tfstate" \
        -backend-config="region=${AWS_REGION}" \
        -backend-config="dynamodb_table=terraform-lock-table"

    - terraform plan \
        -var-file=envs/${ENV}.tfvars \
        -var="image_url=$IMAGE_URI" \
        -out=tfplan

    - terraform apply -auto-approve tfplan

  only:
    - main

# -----------------------------------
# 🔹 ENV DEPLOYMENTS
# -----------------------------------

deploy_dev:
  <<: *deploy_template
  variables:
    ENV: "dev"

deploy_stage:
  <<: *deploy_template
  variables:
    ENV: "stage"
  when: manual

deploy_prod:
  <<: *deploy_template
  variables:
    ENV: "prod"
  when: manual